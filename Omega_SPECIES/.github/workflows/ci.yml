name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y build-essential; fi

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress

      - name: Build library + run all suites (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make test
          make

      - name: Build library + run all suites (Windows/MinGW)
        if: runner.os == 'Windows'
        run: |
          refreshenv
          mingw32-make test
          mingw32-make
